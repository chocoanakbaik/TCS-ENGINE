<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a10">
  <meta name="description" content="TCS Engine browser runtime demonstration by The Choco Studios.">
  <title>TCS Engine — The Choco Studios</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#080a10;color:#f5f7ff;font:13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
    #app{position:fixed;inset:0}
    #topbar{position:fixed;z-index:20;top:16px;left:16px;display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid #303747;border-radius:10px;background:#0b0e16d9;backdrop-filter:blur(12px)}
    #brand{font-weight:800;letter-spacing:.08em;color:#fff}#byline{color:#8d98ad;font-size:10px}
    #status{color:#80f0c0;font-size:11px}
    #controls{position:fixed;z-index:20;top:16px;right:16px;display:flex;gap:8px}
    button{border:1px solid #394256;border-radius:8px;background:#111725;color:#dce4f5;padding:9px 13px;font:inherit;cursor:pointer}
    button:hover,button[aria-pressed=true]{border-color:#9b8cff;color:#fff;background:#25213d}
    #footer{position:fixed;z-index:20;bottom:14px;left:16px;color:#778198;font-size:10px}
  </style>
</head>
<body>
  <div id="app"></div>
  <header id="topbar"><span id="brand">TCS ENGINE</span><span id="byline">BY THE CHOCO STUDIOS</span><span id="status">INITIALIZING</span></header>
  <nav id="controls" aria-label="Rendering mode">
    <button id="btn-2d" type="button" aria-pressed="false">2D</button>
    <button id="btn-3d" type="button" aria-pressed="true">3D</button>
  </nav>
  <footer id="footer">TCS ENGINE v0.1.0 · THE CHOCO STUDIOS</footer>
  <script type="module" src="/demo.js"></script>
</body>
</html>
