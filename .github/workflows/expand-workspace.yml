name: Expand TCS-ENGINE workspace snapshot
on:
  push:
    paths:
      - "workspace-snapshot/TCS-ENGINE_FREKUENSI_0317.tar.gz"
      - ".github/workflows/expand-workspace.yml"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand workspace files into repository root
        run: |
          mkdir -p /tmp/tcs-engine-import
          tar -xzf workspace-snapshot/TCS-ENGINE_FREKUENSI_0317.tar.gz -C /tmp/tcs-engine-import
          rsync -a /tmp/tcs-engine-import/TCS-ENGINE/ ./
      - name: Commit expanded workspace to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync complete TCS-ENGINE workspace and FREKUENSI 03:17"
          git push origin HEAD:main
