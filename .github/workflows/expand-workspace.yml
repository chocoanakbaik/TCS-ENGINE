name: Expand TCS-ENGINE workspace snapshot
on:
  push:
    paths:
      - "workspace-snapshot/parts/*.b64"
      - ".github/workflows/expand-workspace.yml"
permissions:
  contents: write
jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and validate workspace archive
        run: |
          mkdir -p /tmp/tcs-engine-import
          cat workspace-snapshot/parts/*.b64 | base64 --decode > /tmp/TCS-ENGINE_FREKUENSI_0317.tar.gz
          tar -tzf /tmp/TCS-ENGINE_FREKUENSI_0317.tar.gz >/dev/null
          tar -xzf /tmp/TCS-ENGINE_FREKUENSI_0317.tar.gz -C /tmp/tcs-engine-import
          rsync -a /tmp/tcs-engine-import/TCS-ENGINE/ ./
          cp /tmp/TCS-ENGINE_FREKUENSI_0317.tar.gz workspace-snapshot/TCS-ENGINE_FREKUENSI_0317.tar.gz
      - name: Commit expanded workspace to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync complete TCS-ENGINE workspace and FREKUENSI 03:17"
          git push origin HEAD:main
